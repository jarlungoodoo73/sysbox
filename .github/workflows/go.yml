# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.20'

    - name: Build
      shell: bash
      run: |
        mapfile -t modules < <(find . -name go.mod -not -path '*/vendor/*' -printf '%h\n' | sort)
        test "${#modules[@]}" -gt 0
        for module in "${modules[@]}"; do
          echo "::group::go build ${module}"
          (
            cd "${module}"
            go build -buildvcs=false -v ./...
          )
          echo "::endgroup::"
        done

    - name: Test
      shell: bash
      run: |
        mapfile -t modules < <(find . -name go.mod -not -path '*/vendor/*' -printf '%h\n' | sort)
        test "${#modules[@]}" -gt 0
        for module in "${modules[@]}"; do
          echo "::group::go test ${module}"
          (
            cd "${module}"
            go test -buildvcs=false -v ./...
          )
          echo "::endgroup::"
        done
